name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features
      - name: Run examples
        shell: bash
        run: |
          for example in crates/stanmath-rs/examples/*.rs; do
            cargo run --release -p stanmath-rs --example "$(basename "$example" .rs)"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --lib --all-features

  benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run

  # The MPI and OpenCL backends live outside the workspace: they need OpenMPI and an OpenCL
  # runtime. POCL gives a CPU OpenCL device with double precision.
  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backends/stanmath-rs-mpi
            backends/stanmath-rs-opencl
      - name: Install OpenMPI and POCL
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libclang-dev pocl-opencl-icd ocl-icd-opencl-dev clinfo
      - name: MPI example on one and three processes
        working-directory: backends/stanmath-rs-mpi
        run: |
          cargo build --example map_rect_mpi
          mpirun -n 1 target/debug/examples/map_rect_mpi
          mpirun -n 3 --oversubscribe target/debug/examples/map_rect_mpi
      - name: MPI tests
        if: ${{ !cancelled() }}
        working-directory: backends/stanmath-rs-mpi
        run: cargo test
      - name: OpenCL tests
        if: ${{ !cancelled() }}
        working-directory: backends/stanmath-rs-opencl
        run: |
          clinfo -l
          cargo test -- --nocapture
      - name: Format and lint both backends
        if: ${{ !cancelled() }}
        run: |
          for d in backends/stanmath-rs-mpi backends/stanmath-rs-opencl; do
            (cd "$d" && cargo fmt --check && cargo clippy --all-targets -- -D warnings) || status=1
          done
          exit "${status:-0}"
