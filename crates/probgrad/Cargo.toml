[package]
name = "probgrad"
description = "Differentiable mathematics, probability distributions, and transforms for Bayesian computation in Rust"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["rand"]
## Random number generation (`*_rng` functions).
rand = ["probgrad-distributions/rand"]

[dependencies]
probgrad-core.workspace = true
probgrad-autodiff.workspace = true
probgrad-distributions.workspace = true
probgrad-linalg.workspace = true
probgrad-transforms.workspace = true
probgrad-solvers.workspace = true

[dev-dependencies]
rand = { workspace = true, features = ["std_rng"] }
criterion.workspace = true
nuts-rs.workspace = true

[[bench]]
name = "probgrad"
harness = false

[lints]
workspace = true

[[example]]
name = "logistic_regression"
required-features = ["rand"]
