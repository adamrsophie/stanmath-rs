[package]
name = "probgrad-distributions"
description = "Differentiable probability distributions for probgrad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["rand"]
## Random number generation (`*_rng` functions).
rand = ["dep:rand", "dep:rand_distr"]

[dependencies]
probgrad-core.workspace = true
probgrad-autodiff.workspace = true
probgrad-linalg.workspace = true
rand = { workspace = true, optional = true, features = ["alloc"] }
rand_distr = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true, features = ["std_rng"] }

[lints]
workspace = true
